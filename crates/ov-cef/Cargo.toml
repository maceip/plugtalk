[package]
name = "ov-cef"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "CEF browser/render process integration and the native DOM PGP engine for Trap"

[features]
default = []
cef-runtime = ["dep:cef"]

[dependencies]
cef = { workspace = true, optional = true }
log = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
