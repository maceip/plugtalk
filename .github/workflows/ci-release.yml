# Trap — continuous integration, APK/ELF/DEX packaging audit, emulator runtime gate,
# CycloneDX 1.5 + SPDX 2.3 SBOM generation, GitHub Artifact Attestations, and tagged release.
#
# Every branch push (excluding `[skip ci]` commits and `v*`/`build-*` tags), every PR targeting
# `main`, and every manual dispatch runs the 4 required verification gates (`rust-tests`,
# `android-build`, `emulator-gate`, `limrun-device-gate`), while ONLY `push` to `refs/heads/main`
# runs `release` (attesting artifacts, bumping `VERSION`, tagging `v<version>`, and publishing):
#   1. `rust-tests`    — monotonic version dry-run, shell/hook/Node syntax + Limrun gate self-test,
#                        static engine/child-process guards, deterministic icon drift check,
#                        rustfmt, clippy, workspace + `services/pgp-totp-onion` tests, and coverage
#   2. `android-build` — monotonic `VERSION` bump, multi-ABI `cargo-ndk` build (`arm64-v8a` + `x86_64`),
#                        JVM/Robolectric Compose & unit tests, debug APK assembly, strict
#                        `scripts/audit-apk.sh` packaging/DEX/ELF gate, and real Cargo + Gradle +
#                        binary CycloneDX 1.5 & SPDX 2.3 SBOM generation (`scripts/generate-sbom.py`)
#   3. `emulator-gate`      — boots an Android 15 (API 35) x86_64 emulator, installs `app-debug.apk`,
#                             and asserts Cefpack readiness, `ov_tor` loopback SOCKS5 bind, 12s live-PID
#                             stability, zero Java/native crashes/ANRs, and zero JNI/DEX linkage errors
#   4. `limrun-device-gate` — provisions an isolated cloud Android 15 phone instance on Limrun
#                             (`@limrun/api` + `lim` CLI), delta-syncs & installs `app-debug.apk`,
#                             launches `dev.onionvault/.MainActivity` under ActivityManager crash/ANR
#                             watch, verifies Cefpack + Arti Tor bootstrap + live `.onion` navigation
#                             (`iso-duckduckgogg42xj`) + 3-round OpenPGP TOTP `.onion` prize gate,
#                             captures screenshots/logcat/UI tree, and tears down cleanly
#   5. `release`            — (`refs/heads/main` pushes only) attests `app-debug.apk` provenance
#                             (`actions/attest-build-provenance`) and SPDX 2.3 SBOM
#                             (`actions/attest-sbom`), commits `[skip ci]` version bump, pushes
#                             annotated `v<version>` tag, and publishes the latest GitHub Release

name: CI & Release

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "v*"
      - "build-*"
  pull_request:
    branches:
      - "main"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust-tests:
    name: Rust checks, tests and coverage
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            cmake \
            ninja-build \
            libclang-dev \
            python3-pil \
            python3-numpy

      - name: Install the Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add rustfmt clippy llvm-tools-preview

      - name: Cache Cargo dependencies and build artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/cargo-llvm-cov
            ~/.cargo/registry
            ~/.cargo/git
            target
            services/pgp-totp-onion/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Ensure cargo-llvm-cov is installed
        run: |
          if ! command -v cargo-llvm-cov >/dev/null 2>&1; then
            cargo install cargo-llvm-cov --locked
          fi

      - name: Verify monotonic version manifest, shell/hook syntax, Limrun gate self-test, and static crash guards
        run: |
          set -euo pipefail
          python3 scripts/bump-version.py --current
          python3 scripts/bump-version.py --dry-run
          bash -n scripts/*.sh .githooks/pre-push
          node --check scripts/limrun-gate.mjs
          node --check scripts/test-limrun-gate.mjs
          node scripts/test-limrun-gate.mjs
          BANNED_TOKEN="cef""rium"
          if git --no-pager grep -in "$BANNED_TOKEN"; then
            echo "::error::Forbidden legacy '${BANNED_TOKEN}' reference found in repository"
            exit 1
          fi
          python3 - <<'PY'
          import pathlib, re
          src = pathlib.Path("android/app/src/main/kotlin/dev/onionvault/TrapApplication.kt").read_text(encoding="utf-8")
          args = [m.group(1).strip() for m in re.finditer(r"CefpackEngine\s*\.\s*initProcess\s*\(\s*([^)]+?)\s*\)", src)]
          if not args or any(a != "this" for a in args):
              raise SystemExit(f"::error::TrapApplication.kt must only call CefpackEngine.initProcess(this); found args={args}")
          PY

      - name: Check deterministic icon assets
        run: |
          python3 design/icons/trap_icon.py --check
          python3 design/icons/neon/slice_neon.py --check

      - name: Check Rust formatting (workspace and pgp-totp-onion)
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path services/pgp-totp-onion/Cargo.toml --all -- --check

      - name: Run Clippy (workspace and pgp-totp-onion)
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy --manifest-path services/pgp-totp-onion/Cargo.toml --locked --all-targets -- -D warnings

      - name: Type-check workspace
        run: cargo check --workspace --all-targets

      - name: Run workspace and pgp-totp-onion unit and integration tests
        run: |
          cargo test --workspace -- --nocapture
          cargo test --manifest-path services/pgp-totp-onion/Cargo.toml --locked

      - name: Measure Rust test coverage
        run: |
          cargo llvm-cov --workspace --lcov --output-path lcov.info
          cargo llvm-cov --workspace --summary-only

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: rust-coverage
          path: lcov.info
          if-no-files-found: error

  android-build:
    name: Android multi-ABI build, unit tests, APK audit, and SBOM
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: rust-tests
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.bump.outputs.version }}
      version_code: ${{ steps.bump.outputs.version_code }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - name: Free unused runner toolchains for multi-ABI Android build headroom
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h /

      - name: Check out the repository with full tag history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Bump monotonic release version before compiling APK and SBOM
        id: bump
        run: |
          python3 scripts/bump-version.py --apply --github-output "$GITHUB_OUTPUT"

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Locate Android SDK command-line tools
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sdkmanager="$(find "${sdk_root}/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -n 1)"
          if [ -z "${sdkmanager}" ]; then
            echo "::error::sdkmanager was not found in ${sdk_root}/cmdline-tools"
            exit 1
          fi
          dirname "${sdkmanager}" >> "$GITHUB_PATH"
          echo "${sdk_root}/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK 37 and NDK r27c
        run: |
          set +o pipefail
          yes | sdkmanager --licenses > /dev/null
          set -o pipefail
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.2.12479018"
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "${sdk_root}/build-tools/37.0.0" >> "$GITHUB_PATH"

      - name: Configure Android NDK toolchain environment
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          ndk_root="${sdk_root}/ndk/27.2.12479018"
          ndk_bin="${ndk_root}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "${ndk_bin}" >> "$GITHUB_PATH"
          {
            echo "ANDROID_NDK_HOME=${ndk_root}"
            echo "ANDROID_NDK_ROOT=${ndk_root}"
            echo "CC_aarch64_linux_android=${ndk_bin}/aarch64-linux-android29-clang"
            echo "CXX_aarch64_linux_android=${ndk_bin}/aarch64-linux-android29-clang++"
            echo "AR_aarch64_linux_android=${ndk_bin}/llvm-ar"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=${ndk_bin}/aarch64-linux-android29-clang"
            echo "CC_x86_64_linux_android=${ndk_bin}/x86_64-linux-android29-clang"
            echo "CXX_x86_64_linux_android=${ndk_bin}/x86_64-linux-android29-clang++"
            echo "AR_x86_64_linux_android=${ndk_bin}/llvm-ar"
            echo "CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER=${ndk_bin}/x86_64-linux-android29-clang"
          } >> "$GITHUB_ENV"

      - name: Install Rust Android targets and cargo-ndk
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-linux-android x86_64-linux-android

      - name: Cache Cargo Android build artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/cargo-ndk
            ~/.cargo/registry
            ~/.cargo/git
            .cargo-target
          key: ${{ runner.os }}-android-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-android-cargo-

      - name: Ensure cargo-ndk is installed
        run: |
          if ! command -v cargo-ndk >/dev/null 2>&1; then
            cargo install cargo-ndk --locked
          fi

      - name: Cross-compile libonion_vault.so for arm64-v8a and x86_64
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/.cargo-target
        run: |
          cargo ndk -t arm64-v8a -t x86_64 --platform 29 \
            -o android/app/src/main/jniLibs build --release

      - name: Run Android JVM & Robolectric unit tests
        env:
          ONIONVAULT_SKIP_CARGO: "1"
          GH_TOKEN: ${{ github.token }}
        run: ./android/gradlew --project-dir android :app:testDebugUnitTest

      - name: Assemble debug APK and androidTest instrumentation APK
        env:
          ONIONVAULT_SKIP_CARGO: "1"
          GH_TOKEN: ${{ github.token }}
        run: ./android/gradlew --project-dir android :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Audit packaged APK contents, DEX descriptors, and ELF linkage
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          ./scripts/audit-apk.sh "$APK"
          badging="$(aapt2 dump badging "$APK" | awk '/^package:/ && !found { print; found=1 }')"
          grep -Fq "versionName='${{ steps.bump.outputs.version }}'" <<< "$badging" || {
            echo "::error::APK versionName does not match bumped version ${{ steps.bump.outputs.version }}: $badging"
            exit 1
          }
          grep -Fq "versionCode='${{ steps.bump.outputs.version_code }}'" <<< "$badging" || {
            echo "::error::APK versionCode does not match bumped versionCode ${{ steps.bump.outputs.version_code }}: $badging"
            exit 1
          }

      - name: Generate CycloneDX 1.5 and SPDX 2.3 SBOMs
        run: |
          python3 scripts/generate-sbom.py \
            android/app/build/outputs/apk/debug/app-debug.apk \
            --output-dir android/app/build/outputs/sbom

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: trap-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload androidTest instrumentation APK
        uses: actions/upload-artifact@v7
        with:
          name: trap-debug-androidtest-apk
          path: android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error

      - name: Upload CycloneDX 1.5 and SPDX 2.3 SBOMs
        uses: actions/upload-artifact@v7
        with:
          name: trap-sbom
          path: |
            android/app/build/outputs/sbom/app-debug.sbom.cdx.json
            android/app/build/outputs/sbom/app-debug.sbom.spdx.json
          if-no-files-found: error

      - name: Upload license documents
        uses: actions/upload-artifact@v7
        with:
          name: trap-legal-notices
          path: licenses/*.txt
          if-no-files-found: error

      - name: Upload Android unit test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-unit-test-reports
          path: android/app/build/reports/tests
          if-no-files-found: ignore

  emulator-gate:
    name: Launch and verify APK on Android emulator
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: android-build
    permissions:
      contents: read
      actions: read
    steps:
      - name: Free unused runner toolchains for Android 15 AVD image headroom
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h /

      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Download debug APK
        uses: actions/download-artifact@v8
        with:
          name: trap-debug-apk
          path: apk

      - name: Enable KVM for hardware-accelerated x86_64 emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm || true

      - name: Boot emulator and run runtime gate
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          disk-size: 6G
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -cores 4 -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: ./scripts/emulator-gate.sh apk/app-debug.apk dist/emulator-launch.png

      - name: Upload emulator runtime screenshot
        uses: actions/upload-artifact@v7
        with:
          name: emulator-launch-screenshot
          path: dist/emulator-launch.png
          if-no-files-found: error

  limrun-device-gate:
    name: Launch and verify APK on Limrun cloud Android instance
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: android-build
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Cache Limrun CLI and SDK
        uses: actions/cache@v5
        with:
          path: /tmp/trap-limrun-tools
          key: ${{ runner.os }}-limrun-tools-api-0.73.2-cli-0.57.3

      - name: Install pinned Limrun CLI and SDK and run local protocol self-test
        env:
          LIMRUN_TOOLS_DIR: /tmp/trap-limrun-tools
        run: |
          set -euo pipefail
          mkdir -p "$LIMRUN_TOOLS_DIR"
          if [[ ! -f "$LIMRUN_TOOLS_DIR/node_modules/@limrun/api/package.json" || ! -x "$LIMRUN_TOOLS_DIR/node_modules/.bin/lim" ]]; then
            (
              cd "$LIMRUN_TOOLS_DIR"
              printf '{"name":"trap-limrun-tools","private":true}\n' > package.json
              npm install --no-audit --no-fund --save-exact \
                "@limrun/api@0.73.2" \
                "lim@0.57.3"
            )
          fi
          "$LIMRUN_TOOLS_DIR/node_modules/.bin/lim" --version
          node scripts/test-limrun-gate.mjs

      - name: Download debug APK
        uses: actions/download-artifact@v8
        with:
          name: trap-debug-apk
          path: apk

      - name: Download androidTest instrumentation APK
        uses: actions/download-artifact@v8
        with:
          name: trap-debug-androidtest-apk
          path: apk

      - name: Provision Limrun cloud Android 15 phone and run full runtime, .onion & 3-round OpenPGP TOTP prize gate
        env:
          LIM_API_KEY: ${{ secrets.LIM_API_KEY }}
          LIMRUN_API_KEY: ${{ secrets.LIMRUN_API_KEY }}
          LIMRUN_TOOLS_DIR: /tmp/trap-limrun-tools
          LIMRUN_OS_VERSION: "15"
          LIMRUN_MODEL: "phone"
        run: ./scripts/limrun-gate.sh apk/app-debug.apk dist/limrun apk/app-debug-androidTest.apk

      - name: Upload Limrun forensic logs, UI hierarchy, and summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: limrun-device-forensics
          path: dist/limrun/*
          if-no-files-found: ignore

      - name: Upload verified Limrun cloud device screenshots
        uses: actions/upload-artifact@v7
        with:
          name: limrun-device-screenshots
          path: |
            dist/limrun/limrun-launch.png
            dist/limrun/limrun-onion.png
            dist/limrun/limrun-prize.png
            dist/limrun/limrun-summary.json
          if-no-files-found: error

      - name: Sweep any residual Limrun Android instances for this workflow run
        if: always()
        env:
          LIM_API_KEY: ${{ secrets.LIM_API_KEY }}
          LIMRUN_API_KEY: ${{ secrets.LIMRUN_API_KEY }}
          LIMRUN_TOOLS_DIR: /tmp/trap-limrun-tools
        run: |
          set -euo pipefail
          API_KEY="${LIM_API_KEY:-${LIMRUN_API_KEY:-}}"
          LIM_BIN="${LIMRUN_TOOLS_DIR}/node_modules/.bin/lim"
          if [[ -z "${API_KEY//[[:space:]]/}" || ! -x "$LIM_BIN" ]]; then
            exit 0
          fi
          export LIM_API_KEY="$API_KEY"
          RUN_TAG="$(printf '%s-%s' "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT:-1}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9_.-]/-/g')"
          ITEMS_JSON="$("$LIM_BIN" android list --all --label-selector "ci_run=${RUN_TAG}" --json 2>/dev/null || echo '[]')"
          printf '%s' "$ITEMS_JSON" | python3 -c '
          import json, sys
          try:
              items = json.load(sys.stdin)
          except Exception:
              items = []
          for item in items if isinstance(items, list) else []:
              state = (item.get("status") or {}).get("state", "")
              inst_id = (item.get("metadata") or {}).get("id", "")
              if inst_id and state not in ("terminated", "terminating"):
                  print(inst_id)
          ' | while read -r inst_id; do
            if [[ -n "$inst_id" ]]; then
              echo "Deleting residual Limrun Android instance ${inst_id}..."
              "$LIM_BIN" android delete "$inst_id" || true
            fi
          done

  release:
    name: Attest artifacts and publish tagged GitHub release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - rust-tests
      - android-build
      - emulator-gate
      - limrun-device-gate
    permissions:
      contents: write
      id-token: write
      attestations: write
      actions: read
    steps:
      - name: Check out the repository with full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Download debug APK artifact
        uses: actions/download-artifact@v8
        with:
          name: trap-debug-apk
          path: dist

      - name: Download SBOM artifacts
        uses: actions/download-artifact@v8
        with:
          name: trap-sbom
          path: dist

      - name: Download emulator runtime screenshot
        uses: actions/download-artifact@v8
        with:
          name: emulator-launch-screenshot
          path: dist

      - name: Download Limrun cloud Android screenshots and summary
        uses: actions/download-artifact@v8
        with:
          name: limrun-device-screenshots
          path: dist

      - name: Download license documents
        uses: actions/download-artifact@v8
        with:
          name: trap-legal-notices
          path: dist

      - name: Verify release asset layout and compute SHA256SUMS.txt
        run: |
          set -euo pipefail
          for f in \
            app-debug.apk \
            app-debug.sbom.cdx.json \
            app-debug.sbom.spdx.json \
            emulator-launch.png \
            limrun-launch.png \
            limrun-onion.png \
            limrun-prize.png \
            limrun-summary.json \
            GPL-3.0.txt \
            LGPL-2.1.txt \
            LGPL-3.0.txt; do
            test -s "dist/${f}" || {
              echo "::error::Missing or empty release asset dist/${f}"
              exit 1
            }
          done
          (
            cd dist
            sha256sum \
              app-debug.apk \
              app-debug.sbom.cdx.json \
              app-debug.sbom.spdx.json \
              emulator-launch.png \
              limrun-launch.png \
              limrun-onion.png \
              limrun-prize.png \
              limrun-summary.json \
              GPL-3.0.txt \
              LGPL-2.1.txt \
              LGPL-3.0.txt > SHA256SUMS.txt
            cat SHA256SUMS.txt
          )

      - name: Attest APK build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/app-debug.apk

      - name: Attest APK SPDX 2.3 SBOM
        uses: actions/attest-sbom@v4
        with:
          subject-path: dist/app-debug.apk
          sbom-path: dist/app-debug.sbom.spdx.json

      - name: Commit bumped version, push tag, and publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.android-build.outputs.version }}
          RELEASE_VERSION_CODE: ${{ needs.android-build.outputs.version_code }}
          RELEASE_TAG: ${{ needs.android-build.outputs.tag }}
        run: |
          set -euo pipefail
          python3 scripts/bump-version.py --apply \
            --set-version "${RELEASE_VERSION}" \
            --set-version-code "${RELEASE_VERSION_CODE}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add VERSION Cargo.toml Cargo.lock android/app/build.gradle.kts
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): bump version to ${RELEASE_TAG} [skip ci]"
          fi

          if [[ "${GITHUB_REF_TYPE:-}" == "branch" && -n "${GITHUB_REF_NAME:-}" ]]; then
            if ! git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"; then
              echo "::warning::Branch ${GITHUB_REF_NAME} advanced concurrently; tagging release commit without force-pushing."
            fi
          fi

          git tag -a "${RELEASE_TAG}" -m "Trap ${RELEASE_TAG} (versionCode ${RELEASE_VERSION_CODE})"
          git push origin "refs/tags/${RELEASE_TAG}"

          cat <<EOF > /tmp/release-notes.md
