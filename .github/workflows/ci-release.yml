# Trap — continuous integration, emulator verification gate, and release pipeline.
#
# Every push and manual workflow dispatch runs:
#   1. `rust-tests`    — icon drift check, rustfmt, clippy, workspace tests, and coverage
#   2. `android-build` — multi-ABI `cargo-ndk` build (`arm64-v8a` + `x86_64`), JVM/Robolectric
#                        unit & Compose tests, debug APK assembly, and APK binary audit
#   3. `emulator-gate` — boots an Android 15 (API 35) x86_64 emulator, installs `app-debug.apk`,
#                        and verifies Cefrium + Arti Tor launch cleanly and stay alive
#   4. `release`       — publishes a tagged GitHub Release with `app-debug.apk`, license texts,
#                        and SHA-256 checksums

name: CI & Release

on:
  - push
  - workflow_dispatch

permissions:
  contents: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust-tests:
    name: Rust checks, tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            cmake \
            ninja-build \
            libclang-dev \
            python3-pil

      - name: Install the Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add rustfmt clippy llvm-tools-preview
          cargo install cargo-llvm-cov --locked

      - name: Cache Cargo dependencies and build artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check deterministic icon assets
        run: |
          python3 design/icons/trap_icon.py --check
          python3 design/icons/neon/slice_neon.py --check

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Type-check workspace
        run: cargo check --workspace --all-targets

      - name: Run workspace unit and integration tests
        run: cargo test --workspace -- --nocapture

      - name: Measure Rust test coverage
        run: |
          cargo llvm-cov --workspace --lcov --output-path lcov.info
          cargo llvm-cov --workspace --summary-only

      - name: Upload coverage report
        uses: actions/upload-artifact@v6
        with:
          name: rust-coverage
          path: lcov.info
          if-no-files-found: error

  android-build:
    name: Android multi-ABI build, unit tests, and APK audit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: rust-tests
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Locate Android SDK command-line tools
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sdkmanager="$(find "${sdk_root}/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -n 1)"
          if [ -z "${sdkmanager}" ]; then
            echo "::error::sdkmanager was not found in ${sdk_root}/cmdline-tools"
            exit 1
          fi
          echo "$(dirname "${sdkmanager}")" >> "$GITHUB_PATH"
          echo "${sdk_root}/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK 37 and NDK r27c
        run: |
          set +o pipefail
          yes | sdkmanager --licenses > /dev/null
          set -o pipefail
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.2.12479018"

      - name: Configure Android NDK toolchain environment
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          ndk_root="${sdk_root}/ndk/27.2.12479018"
          ndk_bin="${ndk_root}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "ANDROID_NDK_HOME=${ndk_root}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${ndk_root}" >> "$GITHUB_ENV"
          echo "${ndk_bin}" >> "$GITHUB_PATH"
          echo "CC_aarch64_linux_android=${ndk_bin}/aarch64-linux-android29-clang" >> "$GITHUB_ENV"
          echo "CXX_aarch64_linux_android=${ndk_bin}/aarch64-linux-android29-clang++" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=${ndk_bin}/llvm-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=${ndk_bin}/aarch64-linux-android29-clang" >> "$GITHUB_ENV"
          echo "CC_x86_64_linux_android=${ndk_bin}/x86_64-linux-android29-clang" >> "$GITHUB_ENV"
          echo "CXX_x86_64_linux_android=${ndk_bin}/x86_64-linux-android29-clang++" >> "$GITHUB_ENV"
          echo "AR_x86_64_linux_android=${ndk_bin}/llvm-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER=${ndk_bin}/x86_64-linux-android29-clang" >> "$GITHUB_ENV"

      - name: Install Rust Android targets and cargo-ndk
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-linux-android x86_64-linux-android
          cargo install cargo-ndk --locked

      - name: Cache Cargo Android build artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .cargo-target
          key: ${{ runner.os }}-android-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-android-cargo-

      - name: Cross-compile libonion_vault.so for arm64-v8a and x86_64
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/.cargo-target
        run: |
          cargo ndk -t arm64-v8a -t x86_64 --platform 29 \
            -o android/app/src/main/jniLibs build --release

      - name: Run Android JVM & Robolectric unit tests
        env:
          ONIONVAULT_SKIP_CARGO: "1"
        run: ./android/gradlew --project-dir android :app:testDebugUnitTest

      - name: Assemble debug APK
        env:
          ONIONVAULT_SKIP_CARGO: "1"
        run: ./android/gradlew --project-dir android :app:assembleDebug

      - name: Audit packaged APK contents and shared-object linkage
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          entries="$(unzip -Z1 "$APK")"
          for required in \
            "lib/arm64-v8a/libcef.so" \
            "lib/x86_64/libcef.so" \
            "lib/arm64-v8a/libonion_vault.so" \
            "lib/x86_64/libonion_vault.so" \
            "assets/licenses/GPL-3.0.txt" \
            "assets/licenses/LGPL-2.1.txt" \
            "assets/licenses/LGPL-3.0.txt"; do
            echo "$entries" | grep -Fxq "$required" || {
              echo "::error::Missing required APK entry: $required"
              exit 1
            }
          done

          unzip -p "$APK" lib/arm64-v8a/libonion_vault.so > /tmp/libonion_vault.so
          if readelf -d /tmp/libonion_vault.so | grep -q "Shared library: \[libcef.so\]"; then
            echo "::error::libonion_vault.so must not link directly against libcef.so"
            exit 1
          fi
          echo "APK audit passed: Cefrium runtime, multi-ABI libonion_vault.so, and licenses verified."

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: trap-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload license documents
        uses: actions/upload-artifact@v6
        with:
          name: trap-legal-notices
          path: licenses/*.txt
          if-no-files-found: error

      - name: Upload Android unit test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-unit-test-reports
          path: android/app/build/reports/tests
          if-no-files-found: ignore

  emulator-gate:
    name: Launch and verify APK on Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: android-build
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Download debug APK
        uses: actions/download-artifact@v8
        with:
          name: trap-debug-apk
          path: apk

      - name: Enable KVM for hardware-accelerated x86_64 emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator and run runtime gate
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./scripts/emulator-gate.sh apk/app-debug.apk

      - name: Upload emulator runtime screenshot
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: emulator-screenshot
          path: emulator-*.png
          if-no-files-found: ignore

  release:
    name: Publish tagged GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: emulator-gate
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download debug APK artifact
        uses: actions/download-artifact@v8
        with:
          name: trap-debug-apk
          path: dist

      - name: Download license documents
        uses: actions/download-artifact@v8
        with:
          name: trap-legal-notices
          path: dist/licenses

      - name: Compute SHA-256 checksums
        run: (cd dist && sha256sum app-debug.apk licenses/* > SHA256SUMS.txt)

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${{ github.run_number }}-${{ github.sha }}"
          git tag -a "$tag" -m "Trap debug build ${{ github.run_number }} (${{ github.sha }})"
          git push origin "$tag"
          gh release create "$tag" \
            dist/app-debug.apk \
            dist/licenses/* \
            dist/SHA256SUMS.txt \
            --title "Trap debug build ${{ github.run_number }} (${{ github.sha }})" \
            --notes "Trap Android browser powered by Cefrium 0.19.0 (LGPL-3.0-or-later), Arti Tor, and Sequoia OpenPGP. Verified via automated Android emulator runtime gate."
