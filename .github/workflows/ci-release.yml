# Trap — continuous integration and release pipeline.
#
# Every push to *any* branch (and every manual run) executes the whole
# pipeline:
#
#   1. `rust-tests`    — fmt, clippy, check, test and **coverage** of the
#                        Rust workspace,
#   2. `android-build` — Compose preview smoke test and debug APK assembly,
#   3. `emulator-gate` — the APK is launched on an emulator and has to stay
#                        up; nothing is published before that has happened,
#   4. `release`       — publishes a *new* tagged GitHub Release with the APK.
#
# The gate is the point of the pipeline.  A green test suite proves that the
# code compiles and that the logic is right; it does not prove that the
# application starts.  The releases of this project crashed on launch while
# the pipeline was green, because nothing in it ever launched the thing it
# had built.
#
# ## The engine
#
# The engine of the browser is CEF, built from its own sources with the
# Android NDK by the `cefpack` service of the workspace.  CEF publishes no
# Android distribution — there is no package to download — so the service
# builds one and the pipeline consumes the result.
#
# A build of CEF takes hours and needs a machine with a lot of memory and
# disk, therefore it is **not** part of every push: the bundle is built by
# the `cef-build` workflow and cached.  The job below refuses to publish an
# APK when the bundle is missing, rather than shipping one without an engine.
#
# The `rust-tests` job does not need the bundle: the build scripts understand
# `ONIONVAULT_CEF_CHECK_ONLY=1`, which skips the link step, while everything
# else is still type-checked, unit-tested and measured for coverage.

name: CI & Release

on:
  # Any branch, any push.  A release is published for every one of them.
  - push
  - workflow_dispatch

permissions:
  # The release job needs to create tags and GitHub Releases.
  contents: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust-tests:
    name: Rust checks, tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    env:
      # The bundle of the engine cannot be obtained in every job, so the
      # link step is switched off: the crates are still type-checked and
      # unit-tested against the CEF bindings.
      ONIONVAULT_CEF_CHECK_ONLY: "1"
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Install system build dependencies
        # `rusqlite` is built with the `bundled` feature, i.e. SQLite is
        # compiled from C source and needs a C compiler.  `pkg-config` is the
        # conventional companion of the C/C++ build dependencies.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            cmake \
            ninja-build \
            libclang-dev

      - name: Install the Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add rustfmt clippy llvm-tools-preview
          rustup target add aarch64-linux-android
          cargo install cargo-llvm-cov --locked

      - name: Cache the Cargo registry, the Cargo git checkouts and the target directory
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check that the icon lockups did not drift
        run: python3 design/icons/trap_icon.py --check

      - name: Check the formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Type-check the workspace
        run: cargo check --workspace --all-targets

      - name: Type-check the workspace for Android
        # The Android target is where the native code lives; a mistake that
        # only shows up there (a `cfg`, an FFI signature) has to stop the
        # pipeline here and not on a device.
        run: |
          export CC_aarch64_linux_android=aarch64-linux-android29-clang
          export CXX_aarch64_linux_android=aarch64-linux-android29-clang++
          export AR_aarch64_linux_android=llvm-ar
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=aarch64-linux-android29-clang
          cargo check --workspace --target aarch64-linux-android

      - name: Run the workspace unit and integration tests
        run: cargo test --workspace -- --nocapture

      - name: Measure the coverage
        # The coverage of the bundling service is the number that says how
        # much of it is actually exercised.
        run: |
          cargo llvm-cov --workspace --lcov --output-path lcov.info
          cargo llvm-cov --workspace --summary-only

      - name: Upload the coverage report
        uses: actions/upload-artifact@v6
        with:
          name: rust-coverage
          path: lcov.info
          if-no-files-found: error

      - name: Upload the test output
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rust-test-output
          path: target/debug/deps/*.log
          if-no-files-found: ignore

  android-build:
    name: Android debug build and Compose preview test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: rust-tests
    permissions:
      contents: read
      actions: read
    env:
      # The bundle of the engine.  It is produced by the `cef-build` workflow
      # and restored from the cache below; the job refuses to build without
      # it.
      CEF_ANDROID_ROOT: ${{ github.workspace }}/cef-bundle
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Put the SDK tools on the path
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install the Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Install the Android NDK
        run: sdkmanager "ndk;27.2.12479018"

      - name: Accept the Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null

      - name: Export the Android NDK location and its toolchain
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"
          echo "CC_aarch64_linux_android=aarch64-linux-android29-clang" >> "$GITHUB_ENV"
          echo "CXX_aarch64_linux_android=aarch64-linux-android29-clang++" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=llvm-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=aarch64-linux-android29-clang" >> "$GITHUB_ENV"

      - name: Prepare the Gradle wrapper
        run: gradle wrapper --gradle-version 9.7.1

      - name: Install the Rust toolchain and the Android target
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Cache the Cargo registry, the Cargo git checkouts and the target directories
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .cargo-target
            ~/.gradle
          key: ${{ runner.os }}-android-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-android-

      - name: Restore the bundle of the engine
        # The bundle is built by the `cef-build` workflow.  Without it there
        # is no engine, and an APK without an engine cannot start: the job
        # stops here instead of publishing one.
        uses: actions/cache@v5
        with:
          path: cef-bundle
          key: cef-bundle-${{ hashFiles('crates/cefpack/manifest/cef-android.toml') }}
          restore-keys: |
            cef-bundle-

      - name: Check the bundle of the engine
        run: |
          cargo run --release -p cefpack -- plan
          cargo run --release -p cefpack -- audit "$CEF_ANDROID_ROOT"

      - name: Cross-compile the Rust crates for Android
        run: cargo ndk -t arm64-v8a --platform 29 -o android/app/src/main/jniLibs build --release

      - name: Run the Compose preview smoke test
        run: ./android/gradlew --project-dir android :app:testDebugUnitTest

      - name: Assemble the debug APK
        run: ./android/gradlew --project-dir android :app:assembleDebug

      - name: Audit the APK
        # The audit is the gate that this project never had: it checks that
        # the engine is really in the APK, that the resources of the engine
        # are stored and not compressed, that the licences travel with the
        # binary and that the library of the application really depends on
        # the engine.
        run: |
          cargo run --release -p cefpack -- apk android/app/build/outputs/apk/debug/app-debug.apk
          unzip -p android/app/build/outputs/apk/debug/app-debug.apk \
            lib/arm64-v8a/libonion_vault.so > /tmp/libonion_vault.so
          readelf -d /tmp/libonion_vault.so | grep -q "Shared library: \[libcef.so\]" \
            || { echo "::error::the library of the application does not depend on the engine"; exit 1; }
          echo "the library of the application depends on the engine"

      - name: Upload the debug APK
        uses: actions/upload-artifact@v6
        with:
          name: trap-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload the licence documents
        uses: actions/upload-artifact@v6
        with:
          name: trap-legal-notices
          path: |
            licenses/*.txt
            cef-bundle/LICENSE.txt
          if-no-files-found: error

      - name: Upload the Android unit test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-unit-test-reports
          path: android/app/build/reports/tests
          if-no-files-found: ignore

  emulator-gate:
    name: Launch the application on an emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: android-build
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Download the debug APK
        uses: actions/download-artifact@v8
        with:
          name: trap-debug-apk
          path: apk

      - name: Set up the Android SDK
        run: |
          sdkmanager "platform-tools" "system-images;android-35;google_apis;x86_64"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Boot the emulator
        # The engine has to run on the emulator, not only compile.  An arm64
        # engine crashes under the translation of x86_64, so the emulator is
        # an x86_64 one and the APK carries the x86_64 build of the engine as
        # well.
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: apk/emulator-gate.sh
          disable-animations: true

      - name: Upload the screenshot of the running application
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: emulator-screenshot
          path: emulator-*.png
          if-no-files-found: ignore

  release:
    name: Publish the tagged GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: emulator-gate
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download the debug APK artifact
        uses: actions/download-artifact@v8
        with:
          name: trap-debug-apk
          path: dist

      - name: Download the licence documents
        uses: actions/download-artifact@v8
        with:
          name: trap-legal-notices
          path: dist/licenses

      - name: Write the checksums
        run: (cd dist && sha256sum app-debug.apk licenses/* > SHA256SUMS.txt)

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${{ github.run_number }}-${{ github.sha }}"
          git tag -a "$tag" -m "Trap debug build ${{ github.run_number }} (${{ github.sha }})"
          git push origin "$tag"
          gh release create "$tag" \
            dist/app-debug.apk \
            dist/licenses/* \
            dist/SHA256SUMS.txt \
            --title "Trap debug build ${{ github.run_number }} (${{ github.sha }})" \
            --notes "The engine of the browser is CEF, built from its own sources for Android by the bundling service of this repository.  The licences of the engine travel with the binary."
