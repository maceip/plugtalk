<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trap — Android Homescreen &amp; Full-Screen Browser</title>
  <meta
    name="description"
    content="Synced Jetpack Compose @Preview Android homescreen with encircling component callouts, animated Compose @Preview expansion, Monero light wallet, native BTC to XMR Tor swap, and full-screen interactive browser."
  />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&family=Space+Grotesk:wght@600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <h1 class="sr-only">Trap Android Homescreen and Full-Screen Browser</h1>

  <main id="trap-page">
    <!-- Stage 1: Synced Compose @Preview Phone Mock + Encircling Callouts & Animated @Preview Expansion -->
    <section class="phone-showcase" id="phone-showcase" aria-label="Android homescreen component callouts">
      <div class="diagram-stage" id="diagram-stage">
        <svg class="leader-svg" id="leader-svg" aria-hidden="true"></svg>

        <div class="phone-column" id="phone-stage">
          <div class="phone-chassis" id="phone-chassis">
            <div class="phone-viewport" id="phone-viewport">
              <img
                class="phone-image phone-image--base"
                id="preview-base-image"
                src="./generated/assets/homescreen-preview.webp"
                alt="Synced Jetpack Compose Preview of the Trap Android homescreen"
                width="824"
                height="1830"
              />
              <img
                class="phone-image phone-image--expanded"
                id="preview-expanded-image"
                src="./generated/assets/state-side-remote.webp"
                alt="Expanded Jetpack Compose Preview of selected component"
                width="824"
                height="1830"
              />
              <svg
                class="viewport-contour-svg"
                id="viewport-contour-svg"
                viewBox="0 0 412 915"
                preserveAspectRatio="none"
                aria-label="Interactive component contours"
              >
                <g id="contour-hit-layer"></g>
                <g id="contour-highlight-layer"></g>
              </svg>
            </div>
          </div>
        </div>

        <div class="callout-deck" id="callout-deck">
          <div class="callout-column callout-column--left" id="callouts-left"></div>
          <div class="callout-column callout-column--right" id="callouts-right"></div>
        </div>
      </div>
    </section>

    <!-- Stage 2: 100vw x 100vh Edge-to-Edge Full-Screen Interactive Trap Browser -->
    <section class="fullscreen-browser" id="fullscreen-browser" aria-label="Full-screen Trap browser">
      <div class="fs-viewport" id="fs-viewport">
        <div class="fs-start-surface" id="fs-start-surface">
          <img
            class="fs-start-zine"
            id="fs-start-zine"
            src="./generated/assets/sprites/bg_trap_street_zine.webp"
            alt="Trap street-zine start surface"
            draggable="false"
          />
        </div>

        <div class="fs-page-scroll" id="fs-page-scroll" hidden>
          <div class="fs-page-zoom" id="fs-page-zoom">
            <div class="fs-page-content" id="fs-page-content"></div>
          </div>
        </div>
      </div>

      <!-- 12dp Brushed-Steel Perimeter Rails (100% Hit-Test Passthrough) -->
      <div class="fs-steel-rails" id="fs-steel-rails" aria-hidden="true">
        <div class="fs-rail fs-rail--left">
          <div class="fs-rail-wall"></div>
          <div class="fs-rail-bar"></div>
        </div>
        <div class="fs-rail fs-rail--right">
          <div class="fs-rail-bar"></div>
          <div class="fs-rail-wall"></div>
        </div>
        <div class="fs-load-pulse" id="fs-load-pulse"></div>
      </div>

      <!-- Bottom-Docked Active BTC -> XMR Swap Browser HUD -->
      <div class="fs-swap-hud" id="fs-swap-hud" hidden></div>

      <!-- Floating Hardware Pod Cluster -->
      <div class="fs-pods-layer" id="fs-pods-layer">
        <!-- Cast-Pewter Back / Forward Switch -->
        <button
          type="button"
          class="fs-pod fs-back-pod"
          id="fs-back-pod"
          aria-label="Back on tap, hold to go forward"
        >
          <span class="fs-back-glow" id="fs-back-glow" aria-hidden="true"></span>
          <img
            src="./generated/assets/sprites/pod_pewter_back_key.webp"
            alt=""
            draggable="false"
          />
        </button>

        <!-- 3D Knurled Tor Circuit Orb -->
        <button
          type="button"
          class="fs-pod fs-tor-orb"
          id="fs-tor-orb"
          aria-label="Tor circuit status on tap, hold to rotate identity"
        >
          <img
            src="./generated/assets/sprites/pod_tor_purple_orb.webp"
            alt=""
            draggable="false"
          />
          <span class="fs-orb-beacon" id="fs-orb-beacon" aria-hidden="true"></span>
        </button>

        <!-- Recessed 5:4 Pewter CRT Address & Directory Monitor -->
        <div
          class="fs-pod fs-crt-pod"
          id="fs-crt-pod"
          role="button"
          tabindex="0"
          aria-label="Open .onion address bar and directory on tap, swipe horizontally to switch tabs, pull up for tab switcher"
        >
          <img
            src="./generated/assets/sprites/pod_crt_pewter_tv.webp"
            alt=""
            draggable="false"
          />
          <div class="fs-crt-glass">
            <span class="fs-crt-readout" id="fs-crt-readout">search / .onion</span>
          </div>
        </div>

        <!-- +20deg Translucent Red OpenPGP Switchblade -->
        <div
          class="fs-pod fs-pgp-pod"
          id="fs-pgp-pod"
          role="button"
          tabindex="0"
          aria-label="Single click for new tab, double click for OpenPGP keyring, drag upward to verify or decrypt"
        >
          <span class="fs-pgp-led" id="fs-pgp-led" aria-hidden="true"></span>
          <img
            class="fs-pgp-sprite"
            id="fs-pgp-sprite"
            src="./generated/assets/sprites/pod_red_switchblade.webp"
            alt=""
            draggable="false"
          />
        </div>

        <!-- +20deg ZK "TOR" 2x5 LED Side Remote -->
        <button
          type="button"
          class="fs-pod fs-remote-pod"
          id="fs-remote-pod"
          aria-label="Expand hardware remote"
        >
          <img
            src="./generated/assets/sprites/pod_zk_tor_remote.webp"
            alt=""
            draggable="false"
          />
          <span class="fs-remote-leds" id="fs-remote-leds" aria-hidden="true"></span>
        </button>
      </div>

      <!-- Expanded CRT Address Editor + 11-Site Trusted .onion Directory -->
      <div class="fs-crt-overlay" id="fs-crt-overlay" hidden>
        <div class="fs-scrim" id="fs-crt-scrim"></div>
        <div class="fs-crt-editor-stack">
          <div class="fs-directory-sheet" id="fs-directory-sheet"></div>
          <form class="fs-crt-input-well" id="fs-crt-form" autocomplete="off">
            <input
              type="text"
              class="fs-crt-input"
              id="fs-crt-input"
              placeholder="Enter v3 .onion address or search DuckDuckGo over Tor…"
              spellcheck="false"
              autocapitalize="off"
            />
            <button type="submit" class="fs-well-btn fs-well-btn--go" id="fs-crt-go-btn">Go</button>
            <button type="button" class="fs-well-btn" id="fs-crt-close-btn">Close</button>
          </form>
        </div>
      </div>

      <!-- Expanded Upright Hardware Side Remote Drawer -->
      <aside class="fs-remote-drawer" id="fs-remote-drawer" hidden aria-label="Hardware remote">
        <div class="fs-drawer-header">
          <strong class="fs-drawer-title" id="fs-drawer-title">Hardware Remote</strong>
          <button type="button" class="fs-drawer-close" id="fs-drawer-close">✕</button>
        </div>
        <div class="fs-drawer-body" id="fs-drawer-body"></div>
      </aside>

      <!-- Zero-JS Find-in-Page Hardware Pod -->
      <div class="fs-find-pod" id="fs-find-pod" hidden>
        <input
          type="text"
          class="fs-find-input"
          id="fs-find-input"
          placeholder="Search text in page…"
          spellcheck="false"
        />
        <span class="fs-find-count" id="fs-find-count">0/0</span>
        <button type="button" class="fs-well-btn" id="fs-find-prev" aria-label="Previous match">▲</button>
        <button type="button" class="fs-well-btn" id="fs-find-next" aria-label="Next match">▼</button>
        <button type="button" class="fs-well-btn" id="fs-find-close" aria-label="Close text search">✕</button>
      </div>

      <!-- Hardware Modal Host (Tabs, OpenPGP Keyring, Monero Wallet, BTC->XMR Swap, Clearnet Consent, Plaintext Result) -->
      <div class="fs-modal-layer" id="fs-modal-layer" hidden>
        <div class="fs-scrim" id="fs-modal-scrim"></div>
        <div class="fs-modal-sheet" id="fs-modal-sheet" role="dialog" aria-modal="true"></div>
      </div>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
