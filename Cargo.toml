[package]
name = "onion-vault"
version = "0.1.46"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0 OR MIT"
description = "Trap: a zero-JavaScript, Tor-routed mobile browser for Android with a hardware-backed native PGP key manager"
publish = false
build = "build.rs"

[workspace]
members = [
    "crates/ov-core",
    "crates/ov-cef",
    "crates/ov-pgp",
    "crates/ov-tor",
    "crates/ov-xmr",
]

[workspace.package]
version = "0.1.46"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0 OR MIT"

[workspace.dependencies]
anyhow = "1"
log = "0.4"
thiserror = "2"
tokio = { version = "1", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
once_cell = "1"

# Workspace members
ov-core = { path = "crates/ov-core" }
ov-cef = { path = "crates/ov-cef" }
ov-pgp = { path = "crates/ov-pgp" }
ov-tor = { path = "crates/ov-tor" }
ov-xmr = { path = "crates/ov-xmr" }

# Android
jni = "0.21"

# Tor
arti-client = { version = "0.47", default-features = false, features = [
    "tokio",
    "rustls",
    "onion-service-client",
    "compression",
] }
tor-rtcompat = { version = "0.47", default-features = false, features = ["tokio", "rustls"] }

# Rustls with an explicit crypto provider.  The Arti client needs a process
# wide provider, and "ring" is the one that also builds for the Android NDK.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

# PGP
sequoia-openpgp = { version = "1.22", default-features = false, features = [
    "crypto-rust",
    "allow-experimental-crypto",
    "allow-variable-time-crypto",
] }
rusqlite = { version = "0.37", features = ["bundled"] }
aes-gcm = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
getrandom = "0.3"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"

# Monero Light Wallet & Zero-JS Swap
monero-wallet = "0.2"
monero-daemon-rpc = "0.2"
monero-oxide = "0.1"
monero-address = "0.1"
monero-base58 = "0.1"
qrcode = { version = "0.14", default-features = false }
curve25519-dalek = { version = "4", features = ["rand_core", "zeroize"] }
crc32fast = "1.4"
zeroize = { version = "1", features = ["derive"] }
sha2 = "0.10"
url = "2"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
rustls-pki-types = "1"

[target.'cfg(target_os = "android")'.dependencies]
jni = { workspace = true }

[lib]
name = "onion_vault"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
ov-core = { path = "crates/ov-core" }
ov-cef = { path = "crates/ov-cef" }
ov-pgp = { path = "crates/ov-pgp" }
ov-tor = { path = "crates/ov-tor" }
ov-xmr = { path = "crates/ov-xmr" }
log = { workspace = true }
anyhow = { workspace = true }

[profile.dev.package.sha2]
opt-level = 2

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
