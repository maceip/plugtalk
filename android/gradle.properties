# The memory of the daemon is bounded on purpose: the engine of the browser
# brings 31 000 classes of Java 25 into the APK, and the merging of the dex
# files needs a lot of memory at once.  A daemon that asks for more than the
# machine has is killed by the kernel in the middle of the build, which is
# harder to read than a heap that is simply too small.
org.gradle.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
